[package]
name = "pokegame"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["dynamic_linking"] }
rand = "0.9"

[dev-dependencies]
ttf-parser = "0.25"

# Compila rápido nuestro código, pero optimiza las dependencias (Bevy va lento en debug sin esto)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
